name: GBP Just Listed

# Posts a "Just Listed" (or "Coming Soon") Google Business update when a new
# Active / Coming Soon home reaches production. Does not replace the Tuesday
# rotator: social-autopost.yml still calls /api/cron/gbp-post with no query,
# and that run still logs job_name gbp-post.
#
# This workflow calls /api/cron/gbp-post?kind=new-listings, which logs
# job_name gbp-just-listed. One listing per HTTP call, at most 3 per run,
# 65 seconds apart (Google's local-post quota is about one request a minute).
# The route refuses to post when post_log cannot be read, and it skips any
# home in the launch baseline or already announced.
#
# Triggers:
#   - push to main that changes lib/listings.ts (a PAT merge)
#   - workflow_dispatch, including the dispatch from sync-listings.yml after
#     the sync PR merges (a GITHUB_TOKEN merge does not start the push above)
#   - 14:20 and 20:20 UTC, in case the post-merge run was missed
#
# It waits until production /listings is serving this commit's
# listingsSyncedAt AND the preview response includes mode=new-listings.
# Calling the poster before that would hit the old route, which treats an
# unknown kind as the weekly rotator.

on:
  schedule:
    - cron: '20 14 * * *'
    - cron: '20 20 * * *'
  push:
    branches: [main]
    paths:
      - 'lib/listings.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gbp-just-listed
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post new listings once production is serving them
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          alert() {
            echo "::error::$1"
            if [ -n "${PUSHOVER_TOKEN:-}" ] && [ -n "${PUSHOVER_USER:-}" ]; then
              curl -sS --fail -m 20 \
                --form-string "token=$PUSHOVER_TOKEN" \
                --form-string "user=$PUSHOVER_USER" \
                --form-string "title=Just Listed GBP post failed" \
                --form-string "message=$1" \
                --form-string "priority=1" \
                https://api.pushover.net/1/messages.json || echo "::warning::Pushover alert failed"
            fi
          }

          notice() {
            echo "$1"
            echo "::notice::$1"
          }

          if [ -z "$CRON_SECRET" ]; then
            alert "CRON_SECRET is not set in repo secrets."
            exit 1
          fi

          synced=$(sed -n 's/^export const listingsSyncedAt = "\([^"]*\)";/\1/p' lib/listings.ts)
          if [ -z "$synced" ]; then
            alert "Could not read listingsSyncedAt from lib/listings.ts."
            exit 1
          fi
          echo "Waiting until production listings are synced at $synced"

          ready=0
          last_preview_status="000"
          for attempt in $(seq 1 16); do
            html=$(curl -fsSL --max-time 25 "https://www.joshuafink.com/listings" || true)
            preview_file=$(mktemp)
            last_preview_status=$(curl -sS --max-time 25 -o "$preview_file" -w '%{http_code}' \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://www.joshuafink.com/api/cron/gbp-post?kind=new-listings&preview=1" || true)
            if [ -z "$last_preview_status" ]; then
              last_preview_status=000
            fi
            preview=$(cat "$preview_file" || true)
            rm -f "$preview_file"

            page_ok=0
            mode_ok=0
            if printf '%s' "$html" | grep -F "$synced" >/dev/null; then
              page_ok=1
            fi
            if printf '%s' "$preview" | grep -F '"mode":"new-listings"' >/dev/null \
              || printf '%s' "$preview" | grep -F '"mode": "new-listings"' >/dev/null; then
              mode_ok=1
            fi
            echo "Attempt $attempt: page=$page_ok mode=$mode_ok preview_http=$last_preview_status"
            if [ "$page_ok" = "1" ] && [ "$mode_ok" = "1" ]; then
              ready=1
              echo "Production is serving this listing sync."
              break
            fi
            if [ "$attempt" -lt 16 ]; then
              sleep 30
            fi
          done

          if [ "$ready" != "1" ]; then
            if [ "$last_preview_status" = "401" ]; then
              alert "Just Listed preview was unauthorized. Check that GitHub CRON_SECRET matches Vercel."
              exit 1
            fi
            notice "Production is not serving listingsSyncedAt ${synced} with the Just Listed route yet. Not posting."
            exit 0
          fi

          # Cap matches JUST_LISTED_PER_RUN / JUST_LISTED_GAP_MS in
          # app/api/cron/gbp-post/just-listed.ts. One create per call.
          posted=0
          calls=0
          while [ "$posted" -lt 3 ] && [ "$calls" -lt 6 ]; do
            calls=$((calls + 1))
            echo "──────────────────────────────────────────────"
            echo "Posting one new listing (call $calls, posted $posted so far)."
            response=$(curl -sS --max-time 120 -w "\n%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://www.joshuafink.com/api/cron/gbp-post?kind=new-listings" || true)
            status=$(printf '%s\n' "$response" | tail -n1)
            body=$(printf '%s\n' "$response" | sed '$d')
            echo "HTTP $status"
            echo "$body"

            if [ "$status" != "200" ]; then
              alert "Just Listed GBP call failed with HTTP ${status}. See run ${{ github.run_id }}."
              exit 1
            fi

            skipped=$(printf '%s' "$body" | jq -r '.skipped // empty' || true)
            did_post=$(printf '%s' "$body" | jq -r '.posted // false' || true)
            remaining=$(printf '%s' "$body" | jq -r '.remaining // 0' || true)

            if [ "$skipped" = "none_pending" ]; then
              echo "No new listings to announce."
              exit 0
            fi
            if [ "$skipped" = "already_posted" ]; then
              echo "That home was already announced. Checking the next one."
              continue
            fi
            if [ "$did_post" = "true" ]; then
              posted=$((posted + 1))
              echo "Posted ($posted this run). Remaining after this post: $remaining"
              if [ "$remaining" = "0" ] || [ "$posted" -ge 3 ]; then
                echo "Done."
                exit 0
              fi
              echo "Waiting 65s before the next GBP post (quota)."
              sleep 65
              continue
            fi

            alert "Just Listed GBP returned 200 but did not post. See run ${{ github.run_id }}."
            exit 1
          done
          echo "Done."
