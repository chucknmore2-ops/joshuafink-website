name: Build check

# Guarantees every PR to main typechecks and builds before merge. The bot's
# auto-merge ("auto-merge when CI is green" at autonomy tier 2) relies on this
# being a required, broad gate — schema-validation.yml also builds, but only
# for app/**, lib/** path changes, so this catches the rest (components/**,
# config, scripts). A Tier-1 direct push to main bypasses PR checks entirely,
# which is exactly the gap that let a build-breaking commit ship uncaught.

on:
  pull_request:
    branches: [main]
  # "build" is the one required status check on main, and it only ran on PRs —
  # so sync-listings' PR had no way to ever go green. Run on the sync branches
  # too; the check lands on the branch head SHA, which is what branch
  # protection reads. (sync-listings.yml also dispatches this workflow, because
  # a push made with GITHUB_TOKEN does not itself trigger workflows.)
  push:
    branches: ['sync-listings/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

# actions/checkout + setup-* ship as Node 20 JS actions; GitHub forces the
# Node 24 runtime on 2026-06-16. This env var keeps them running across
# the cutover without per-action version chases.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Runs BEFORE the build: these are the cheapest checks and the ones most
      # likely to catch a real regression. lib/classify-lead.test.ts exists
      # because that logic silently discarded real leads four separate times —
      # until now nothing executed it on a pull request, so the guard was
      # decorative. A failure here must fail the PR.
      #
      # The runner goes through tsx rather than bare `node --test`: this job
      # pins Node 20, which cannot load a .ts file at all, so `npm test` failed
      # here on every test file the first time it was wired up. tsx is already a
      # devDependency (the GEO audit runs on it), so this needs no new install
      # and no change to the Node version the site is built with.
      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
