name: Sync Compass Listings

# Daily sync of Joshua's listings from https://www.compass.com/agents/joshua-fink/
# via scripts/sync-all.sh — writes lib/listings.ts + lib/sold-listings.ts and
# opens an auto-merging PR if there are diffs.
#
# NOT a direct push to main: main is protected and requires the "build" status
# check, so `git push origin main` from here is rejected with GH006 (that broke
# every run from 2026-08-05 on, silently freezing the site's listings).

on:
  schedule:
    # Daily at 08:00 UTC (02:00 CST / 03:00 CDT)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allow manual runs from the Actions UI

permissions:
  contents: write
  pull-requests: write
  actions: write # to dispatch build-check on the sync branch (see below)

# actions/checkout + setup-* ship as Node 20 JS actions; GitHub forces the
# Node 24 runtime on 2026-06-16. This env var keeps them running across
# the cutover without per-action version chases.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Sync listings from Compass
        run: bash scripts/sync-all.sh

      - name: Open auto-merging PR with updated listing files
        env:
          TZ: America/Chicago
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add lib/listings.ts lib/sold-listings.ts
          if git diff --cached --quiet; then
            echo 'No listing changes — nothing to commit.'
            exit 0
          fi

          BRANCH="sync-listings/$(date +%Y-%m-%d-%H%M%S)"
          TITLE="chore: daily listing sync from Compass [$(date +%F)]"
          git checkout -b "$BRANCH"
          git commit -m "$TITLE"
          git push origin "$BRANCH"

          # GitHub deliberately does NOT fire push/pull_request workflows for
          # refs pushed with GITHUB_TOKEN (recursion guard), so build-check
          # would never report and auto-merge would hang forever. workflow_dispatch
          # is the documented exception — dispatch it explicitly against the
          # branch so the required "build" check lands on this SHA.
          gh workflow run build-check.yml --ref "$BRANCH"

          # If anything past the push fails, delete the branch we just created.
          # On 2026-08-05 `gh pr create` started failing with "GitHub Actions is
          # not permitted to create or approve pull requests" (repo setting
          # Settings → Actions → General → "Allow GitHub Actions to create and
          # approve pull requests"). The branch was pushed every night anyway,
          # so six days of orphaned sync-listings/* branches piled up while the
          # site's listings stayed frozen. Clean up so a failed run leaves no
          # trace and the next run starts from a clean slate.
          cleanup_branch() {
            echo "::error::Failed to open/auto-merge the sync PR — deleting $BRANCH."
            echo '::error::If the message above is about permissions, enable Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".'
            git push origin --delete "$BRANCH" || true
          }
          trap cleanup_branch ERR

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body 'Automated Compass listing sync. Merges itself once the `build` check is green.')
          echo "Opened $PR_URL"
          gh pr merge "$PR_URL" --squash --auto --delete-branch
          trap - ERR
