name: Sync Compass Listings

# Daily sync of Joshua's listings from https://www.compass.com/agents/joshua-fink/
# via scripts/sync-all.sh — writes lib/listings.ts + lib/sold-listings.ts and
# opens an auto-merging PR if there are diffs.
#
# NOT a direct push to main: main is protected and requires the "build" status
# check, so `git push origin main` from here is rejected with GH006 (that broke
# every run from 2026-08-05 on, silently freezing the site's listings).

on:
  schedule:
    # Daily at 08:00 UTC (02:00 CST / 03:00 CDT)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allow manual runs from the Actions UI

permissions:
  contents: write
  pull-requests: write
  actions: write # to dispatch build-check on the sync branch (see below)

# actions/checkout + setup-* ship as Node 20 JS actions; GitHub forces the
# Node 24 runtime on 2026-06-16. This env var keeps them running across
# the cutover without per-action version chases.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # SYNC_PAT is a fine-grained PAT with an expiry date, and nothing used to watch
  # it. `secrets.SYNC_PAT || secrets.GITHUB_TOKEN` only falls back when the secret
  # is EMPTY — an expired PAT is still a non-empty string, so the sync would just
  # start failing, and the weekday-only healthcheck would not say so until Monday.
  # This job turns the run red two weeks ahead, which the healthcheck's
  # "github-actions — Sync Compass Listings" check pages on. It runs alongside
  # the sync and never blocks it.
  sync-pat-expiry:
    name: SYNC_PAT expiry
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail two weeks before SYNC_PAT expires
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
          WARN_DAYS: '14'
        run: |
          if [ -z "$SYNC_PAT" ]; then
            echo '::notice::SYNC_PAT is not set — the sync falls back to GITHUB_TOKEN (PRs will wait on the approval gate).'
            exit 0
          fi
          status=$(curl -sS -o /dev/null -D headers.txt -w '%{http_code}' \
            -H "Authorization: Bearer $SYNC_PAT" https://api.github.com/rate_limit)
          if [ "$status" != "200" ]; then
            echo "::error::SYNC_PAT was rejected (HTTP $status) — it has expired or been revoked. Regenerate it at https://github.com/settings/personal-access-tokens and run: gh secret set SYNC_PAT"
            exit 1
          fi
          # GitHub reports a PAT's expiry in this response header; a token with
          # no expiry simply omits it.
          expires=$(grep -i '^github-authentication-token-expiration:' headers.txt | cut -d' ' -f2- | tr -d '\r')
          if [ -z "$expires" ]; then
            echo 'SYNC_PAT has no expiry date.'
            exit 0
          fi
          days_left=$(( ($(date -d "$expires" +%s) - $(date +%s)) / 86400 ))
          echo "SYNC_PAT expires $expires ($days_left days left)."
          if [ "$days_left" -le "$WARN_DAYS" ]; then
            echo "::error::SYNC_PAT expires $expires ($days_left days left). Regenerate it at https://github.com/settings/personal-access-tokens and run: gh secret set SYNC_PAT"
            exit 1
          fi

  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Sync listings from Compass
        run: bash scripts/sync-all.sh

      - name: Open auto-merging PR with updated listing files
        env:
          TZ: America/Chicago
          # Prefer a PAT, because the PR's AUTHOR decides whether its checks are
          # gated. Opened with GITHUB_TOKEN the author is `app/github-actions`,
          # which Settings → Actions → General → "Require approval for first-time
          # contributors" treats as an unproven contributor: the pull_request
          # build-check run is created in `action_required` and waits for a manual
          # Approve-and-run click. On 2026-08-18 that held the required `build`
          # check for 17 hours (run 32117725100, attempt 1 `action_required`,
          # attempt 2 passed in 74s once approved) and the site served ~6-day-old
          # listings. PRs authored by chucknmore2-ops build in ~2 minutes.
          #
          # Loosening that repo setting is NOT the fix: this repo is public, so it
          # would let a stranger's first PR run workflows automatically, and
          # build-check runs `npm ci` on their code.
          #
          # Falls back to GITHUB_TOKEN when SYNC_PAT is unset OR no longer
          # accepted (expired/revoked) — checked live below, because a stale
          # secret is non-empty and a `||` expression would never fall back.
          # Needs a fine-grained PAT with contents:write + pull_requests:write.
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HAS_PAT=false
          GH_TOKEN="$FALLBACK_TOKEN"
          if [ -n "$SYNC_PAT" ]; then
            pat_status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $SYNC_PAT" https://api.github.com/rate_limit || echo 000)
            if [ "$pat_status" = "200" ]; then
              HAS_PAT=true
              GH_TOKEN="$SYNC_PAT"
            else
              echo "::warning::SYNC_PAT rejected (HTTP $pat_status) — opening the PR with GITHUB_TOKEN, so its build check will wait for manual approval."
            fi
          fi
          export GH_TOKEN

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add lib/listings.ts lib/sold-listings.ts
          if git diff --cached --quiet; then
            echo 'No listing changes — nothing to commit.'
            exit 0
          fi

          BRANCH="sync-listings/$(date +%Y-%m-%d-%H%M%S)"
          TITLE="chore: daily listing sync from Compass [$(date +%F)]"
          git checkout -b "$BRANCH"
          git commit -m "$TITLE"
          git push origin "$BRANCH"

          # Every `gh` call below talks to api.github.com, and a momentary blip
          # there kills the whole nightly run — the 2026-08-12 run died on a TLS
          # error dispatching build-check. Retry each call a couple of times with
          # backoff so a transient glitch costs seconds, not a day of listings.
          # Progress goes to stderr so `$(gh_retry gh pr create ...)` still
          # captures only the PR URL.
          gh_retry() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 3 ]; then
                echo "::error::\`$*\` failed after $attempt attempts." >&2
                return 1
              fi
              echo "\`$*\` failed (attempt $attempt) — retrying in $((attempt * 15))s." >&2
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
            done
          }

          # If anything past the push fails, delete the branch we just created.
          # On 2026-08-05 `gh pr create` started failing with "GitHub Actions is
          # not permitted to create or approve pull requests" (repo setting
          # Settings → Actions → General → "Allow GitHub Actions to create and
          # approve pull requests"). The branch was pushed every night anyway,
          # so six days of orphaned sync-listings/* branches piled up while the
          # site's listings stayed frozen. Clean up so a failed run leaves no
          # trace and the next run starts from a clean slate — this is armed
          # before the dispatch below so a failure there cleans up too.
          cleanup_branch() {
            echo "::error::Failed to open/auto-merge the sync PR — deleting $BRANCH."
            echo '::error::If the message above is about permissions, enable Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".'
            git push origin --delete "$BRANCH" || true
          }
          trap cleanup_branch ERR

          # Fallback for when there is no SYNC_PAT and the PR is therefore opened
          # by the bot. Dispatch build-check explicitly so a green `build` exists
          # on this SHA — push events from GITHUB_TOKEN never fire it themselves.
          #
          # Be clear about what this does and does not buy you. It is NOT a fix:
          # the bot-authored PR still gets its own gated `pull_request` build-check
          # run, and that second check run — same name, same SHA, sitting in
          # `action_required` — is what branch protection reads, so the PR stays
          # BLOCKED regardless of this green one. That is exactly what happened on
          # 2026-08-18. It is kept only so the check is already green the moment
          # someone approves, and it is skipped under a PAT, where the normal
          # pull_request run reports on its own and a duplicate would just race it.
          if [ "$HAS_PAT" != "true" ]; then
            gh_retry gh workflow run build-check.yml --ref "$BRANCH"
          fi

          PR_URL=$(gh_retry gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body 'Automated Compass listing sync. Merges itself once the `build` check is green.')
          echo "Opened $PR_URL"
          gh_retry gh pr merge "$PR_URL" --squash --auto --delete-branch
          trap - ERR
