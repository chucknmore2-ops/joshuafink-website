name: Dispatch custom listing video once

# One-shot bridge. The agent token that merges pull requests cannot create a
# workflow_dispatch event. Pushing this file runs it, and this job dispatches
# Post custom listing video with the approved 201 Spartan Dr inputs.
# Remove this file after that run has started so it cannot fire again.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-custom-listing-video-once.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-custom-listing-video-once
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the approved Spartan video
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run post-custom-listing-video.yml --repo "${GITHUB_REPOSITORY}" --ref main \
            -f video_url='https://v3b.fal.media/files/b/0ab2119d/afDNHSmkoYhIqFQAk7dXp_spartan-sample-hiphop.mp4' \
            -f sha256='bf510094be3f3b5a58f279a6d12206ef01222e4ed84a69113c374072bdc3b14b' \
            -f address='201 Spartan Dr' \
            -f replace_youtube_id='3XpZKdw8iDU' \
            -f replace_buffer_id='6af345dea80c88d576473b79'
