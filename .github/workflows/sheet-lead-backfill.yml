name: Sheet lead backfill

# Writes leads that failed to reach the Google Sheet once the Apps Script
# is healthy again. Vercel Hobby allows two cron jobs and both slots are
# taken (indexnow, listing-alerts), so this uses GitHub Actions the same
# way geo-audit and the social posts do.
#
# Required repository secret (already set for the other cron routes):
#   CRON_SECRET — must match the Vercel env. The route itself reads
#   DATABASE_URL and GOOGLE_SHEET_WEBHOOK_URL from Vercel, not from Actions.

on:
  schedule:
    # Twice an hour, at :10 and :40, clear of indexnow (02:00) and
    # listing-alerts (13:30). A second slot covers hours GitHub skips.
    - cron: '10,40 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sheet-lead-backfill
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Drain queued sheet leads
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set in repo secrets."
            exit 1
          fi

          # www, not the apex: joshuafink.com 307s to www and curl would
          # drop Authorization across that redirect.
          # One function call has a 45s budget, so a full queue needs more
          # than one call. Three passes stay inside this job's 5 minutes.
          # This is not a new Vercel cron.
          CRON_URL="https://www.joshuafink.com/api/cron/sheet-lead-backfill"
          made_progress=0
          pass=1
          while [ "$pass" -le 3 ]; do
            echo "pass $pass"
            response=$(curl -sS --max-time 70 -w "\n%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$CRON_URL" || true)
            status=$(printf '%s\n' "$response" | tail -n1)
            body=$(printf '%s\n' "$response" | sed '$d')
            echo "HTTP $status"
            echo "$body"
            if [ "$status" != "200" ]; then
              echo "::error::Sheet lead backfill returned HTTP $status"
              exit 1
            fi

            # A 200 that wrote nothing while rows are still queued is the
            # stall from 2026-10-23: one short timeout was treated as success.
            # A later pass may write 0 because the only row left is a single
            # HTTP 404. That is not a stall when an earlier pass made progress.
            written=$(printf '%s' "$body" | jq -r '.written // 0')
            queued=$(printf '%s' "$body" | jq -r 'if .remaining == null then 0 else (.remaining.queued // 0) end')
            configured=$(printf '%s' "$body" | jq -r '.configured // false')
            stopped=$(printf '%s' "$body" | jq -r '.stopped // false')
            detail=$(printf '%s' "$body" | jq -r '.detail // empty')
            if [ "$written" != "0" ]; then
              made_progress=1
            fi
            if [ "$configured" = "true" ] && [ "$written" = "0" ] && [ "$queued" != "0" ]; then
              if [ "$made_progress" != "1" ]; then
                echo "::error::Backfill wrote 0 of $queued queued leads (${detail:-no detail})"
                exit 1
              fi
              echo "Pass wrote 0; leaving $queued queued for the next run (${detail:-no detail})"
              break
            fi
            if [ "$queued" = "0" ] || [ "$stopped" = "true" ] || [ "$written" = "0" ]; then
              break
            fi
            if [ "$pass" -lt 3 ]; then
              sleep 2
            fi
            pass=$((pass + 1))
          done
