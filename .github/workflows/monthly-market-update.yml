name: Monthly Market Update

# Posts the month's Middle Tennessee market numbers to Facebook, LinkedIn,
# and Google Business once lib/market-snapshot.ts changes on main. The blog
# post is already rendered from that file by lib/blog.ts; it goes live with
# the deploy that carries the commit.
#
# Triggered by the merge from fetch-gnar-snapshot.yml (and by that workflow's
# explicit dispatch, because a GITHUB_TOKEN merge does not start push
# workflows). workflow_dispatch still runs it by hand.
#
# Waits until www.joshuafink.com is serving this commit's figures, then
# posts. Each channel skips with already_posted if that month went out
# before, so a second run does not double-post. A stale deploy is not posted.

on:
  push:
    branches: [main]
    paths:
      - 'lib/market-snapshot.ts'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: monthly-market-update
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post once production is serving this snapshot
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          alert() {
            echo "::error::$1"
            if [ -n "${PUSHOVER_TOKEN:-}" ] && [ -n "${PUSHOVER_USER:-}" ]; then
              curl -sS --fail -m 20 \
                --form-string "token=$PUSHOVER_TOKEN" \
                --form-string "user=$PUSHOVER_USER" \
                --form-string "title=Monthly market post failed" \
                --form-string "message=$1" \
                --form-string "priority=1" \
                https://api.pushover.net/1/messages.json || echo "::warning::Pushover alert failed"
            fi
          }

          if [ -z "$CRON_SECRET" ]; then
            alert "CRON_SECRET is not set in repo secrets."
            exit 1
          fi

          meta=$(node scripts/snapshot-expect.mjs)
          query=$(printf '%s\n' "$meta" | head -n1)
          slug=$(printf '%s\n' "$meta" | sed -n '2p')
          median=$(printf '%s\n' "$query" | tr '&' '\n' | sed -n 's/^expectMedian=//p')
          supply=$(printf '%s\n' "$query" | tr '&' '\n' | sed -n 's/^expectSupply=//p')
          yoy_raw=$(printf '%s\n' "$query" | tr '&' '\n' | sed -n 's/^expectYoy=//p')
          yoy=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.unquote(sys.argv[1]))' "$yoy_raw")
          median_text=$(python3 -c 'import sys; print(f"{int(sys.argv[1]):,}")' "$median")
          page="https://www.joshuafink.com/blog/${slug}"
          echo "Waiting until $page contains $median_text"

          ready=0
          for attempt in $(seq 1 16); do
            html=$(curl -fsSL --max-time 25 "$page" || true)
            if printf '%s' "$html" | MEDIAN="$median_text" SUPPLY="$supply" YOY="$yoy" python3 -c '
import os, sys
html = sys.stdin.read()
ok = ("$" + os.environ["MEDIAN"]) in html
supply = os.environ["SUPPLY"]
yoy = os.environ["YOY"]
if supply != "none":
    i = html.find("Months of supply")
    ok = ok and i >= 0 and supply in html[i:i+80]
if yoy != "none":
    ok = ok and yoy in html
sys.exit(0 if ok else 1)
'; then
              ready=1
              echo "Production is serving this snapshot (attempt $attempt)."
              break
            fi
            echo "Not live yet (attempt $attempt); sleeping 30s."
            sleep 30
          done
          if [ "$ready" != "1" ]; then
            alert "Production never served ${slug} with median ${median_text}. Social posts were not sent."
            exit 1
          fi

          ENDPOINTS=(
            "facebook-post?${query}"
            "linkedin-post?kind=market&${query}"
            "gbp-post?kind=market&${query}"
          )

          failed=0
          for endpoint in "${ENDPOINTS[@]}"; do
            URL="https://www.joshuafink.com/api/cron/${endpoint}"
            echo "──────────────────────────────────────────────"
            echo "Posting via $URL"
            posted=0
            for attempt in 1 2 3; do
              echo "Attempt $attempt…"
              response=$(curl -sSL -w "\n%{http_code}" \
                -H "Authorization: Bearer $CRON_SECRET" \
                "$URL" || true)
              status=$(echo "$response" | tail -n1)
              body=$(echo "$response" | sed '$d')
              echo "HTTP $status"
              echo "$body"
              if [ "$status" = "200" ]; then
                if echo "$body" | grep -q '"deploy_pending"'; then
                  echo "Deploy flag still pending; retrying."
                elif echo "$body" | grep -q '"already_posted"'; then
                  posted=1
                  echo "Already posted for this month."
                  break
                elif echo "$body" | grep -q '"posted":true\|"posted": true'; then
                  posted=1
                  echo "Posted."
                  break
                else
                  echo "200 but not a confirmed post. Body left unposted."
                fi
              fi
              sleep $((attempt * 15))
            done
            if [ "$posted" != "1" ]; then
              echo "::error::$endpoint was not posted."
              failed=$((failed + 1))
            fi
          done

          if [ "$failed" -gt 0 ]; then
            alert "${failed} market channel(s) did not post. See run ${{ github.run_id }}."
            exit 1
          fi
          echo "Done."
