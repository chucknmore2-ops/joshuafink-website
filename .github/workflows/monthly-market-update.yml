name: Monthly Market Update

# Posts the month's Middle Tennessee market numbers to LinkedIn and Google
# Business once lib/market-snapshot.ts changes on main. Facebook is published
# by the Railway autoposter, which holds the Page token. This workflow only
# waits for that service's post_log row. It does not call a site Facebook
# endpoint. The blog post is already rendered from that file by lib/blog.ts;
# it goes live with the deploy that carries the commit.
#
# Does not run on unrelated pushes. A push to main starts it only when
# lib/market-snapshot.ts changes (the GNAR snapshot PR). fetch-gnar-snapshot.yml
# also dispatches it, because a GITHUB_TOKEN merge does not start push
# workflows. workflow_dispatch runs it by hand; pass month=YYYY-MM to refuse
# any other snapshot.
#
# Waits until www.joshuafink.com is serving this commit's figures, then
# posts LinkedIn and Google Business. Each of those skips with already_posted
# if that month went out before, so a second run does not double-post. Facebook
# is already deduped by the autoposter on the same post_log key. A stale
# deploy is not posted.
#
# The production HTML check is scripts/snapshot-page-ready.mjs. Do not paste
# a column-0 script into this file: that ends the YAML block and GitHub then
# fails the workflow on every push with zero jobs.

on:
  push:
    branches: [main]
    paths:
      - 'lib/market-snapshot.ts'
  workflow_dispatch:
    inputs:
      month:
        description: 'Post this month only (YYYY-MM). Must be the newest snapshot. Empty posts the newest.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: monthly-market-update
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post once production is serving this snapshot
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          REQUESTED_MONTH: ${{ inputs.month || '' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          alert() {
            echo "::error::$1"
            if [ -n "${PUSHOVER_TOKEN:-}" ] && [ -n "${PUSHOVER_USER:-}" ]; then
              curl -sS --fail -m 20 \
                --form-string "token=$PUSHOVER_TOKEN" \
                --form-string "user=$PUSHOVER_USER" \
                --form-string "title=Monthly market post failed" \
                --form-string "message=$1" \
                --form-string "priority=1" \
                https://api.pushover.net/1/messages.json || echo "::warning::Pushover alert failed"
            fi
          }

          if [ -z "$CRON_SECRET" ]; then
            alert "CRON_SECRET is not set in repo secrets."
            exit 1
          fi

          meta=$(node scripts/snapshot-expect.mjs)
          query=$(printf '%s\n' "$meta" | head -n1)
          slug=$(printf '%s\n' "$meta" | sed -n '2p')
          got_month=$(printf '%s\n' "$query" | tr '&' '\n' | sed -n 's/^expectMonth=//p')
          echo "Newest snapshot is ${got_month} (${slug})."
          if [ -n "$REQUESTED_MONTH" ]; then
            if ! printf '%s' "$REQUESTED_MONTH" | grep -Eq '^[0-9]{4}-[0-9]{2}$'; then
              alert "month input must be YYYY-MM."
              exit 1
            fi
            if [ "$got_month" != "$REQUESTED_MONTH" ]; then
              alert "Refusing to post ${got_month}; this run was dispatched for ${REQUESTED_MONTH}."
              exit 1
            fi
          fi
          median=$(printf '%s\n' "$query" | tr '&' '\n' | sed -n 's/^expectMedian=//p')
          supply=$(printf '%s\n' "$query" | tr '&' '\n' | sed -n 's/^expectSupply=//p')
          yoy_raw=$(printf '%s\n' "$query" | tr '&' '\n' | sed -n 's/^expectYoy=//p')
          yoy=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.unquote(sys.argv[1]))' "$yoy_raw")
          median_text=$(python3 -c 'import sys; print(f"{int(sys.argv[1]):,}")' "$median")
          page="https://www.joshuafink.com/blog/${slug}"
          echo "Waiting until $page contains $median_text"

          ready=0
          for attempt in $(seq 1 16); do
            html=$(curl -fsSL --max-time 25 "$page" || true)
            if printf '%s' "$html" | MEDIAN="$median_text" SUPPLY="$supply" YOY="$yoy" node scripts/snapshot-page-ready.mjs; then
              ready=1
              echo "Production is serving this snapshot (attempt $attempt)."
              break
            fi
            echo "Not live yet (attempt $attempt); sleeping 30s."
            sleep 30
          done
          if [ "$ready" != "1" ]; then
            alert "Production never served ${slug} with median ${median_text}. Social posts were not sent."
            exit 1
          fi

          ENDPOINTS=(
            "linkedin-post?kind=market&${query}"
            "gbp-post?kind=market&${query}"
          )

          failed=0
          for endpoint in "${ENDPOINTS[@]}"; do
            URL="https://www.joshuafink.com/api/cron/${endpoint}"
            echo "──────────────────────────────────────────────"
            echo "Posting via $URL"
            posted=0
            # LinkedIn and GBP post in this run and return already_posted
            # on a repeat. Facebook is not called here.
            max_attempts=3
            for attempt in $(seq 1 "$max_attempts"); do
              echo "Attempt $attempt…"
              response=$(curl -sSL -w "\n%{http_code}" \
                -H "Authorization: Bearer $CRON_SECRET" \
                "$URL" || true)
              status=$(echo "$response" | tail -n1)
              body=$(echo "$response" | sed '$d')
              echo "HTTP $status"
              echo "$body"
              if [ "$status" = "200" ]; then
                if echo "$body" | grep -q '"deploy_pending"'; then
                  echo "Deploy flag still pending; retrying."
                elif echo "$body" | grep -q '"skipped":"no_snapshot"'; then
                  echo "No current snapshot. Not posting."
                  break
                elif echo "$body" | grep -q '"pending":"autoposter"'; then
                  echo "Waiting for the autoposter to publish this month."
                elif echo "$body" | grep -q '"already_posted"'; then
                  posted=1
                  echo "Already posted for this month."
                  break
                elif echo "$body" | grep -q '"posted":true\|"posted": true'; then
                  posted=1
                  echo "Posted."
                  break
                else
                  echo "200 but not a confirmed post. Body left unposted."
                fi
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep 20
              fi
            done
            if [ "$posted" != "1" ]; then
              echo "::error::$endpoint was not posted."
              failed=$((failed + 1))
            fi
          done

          # The autoposter tick publishes Facebook and writes the dedupe row.
          # Poll that row. Do not call the site.
          python3 -m pip install --quiet 'psycopg2-binary==2.9.10'
          fb_posted=0
          fb_error=0
          for attempt in $(seq 1 24); do
            set +e
            python3 scripts/monthly-facebook-row.py "$got_month"
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              fb_posted=1
              echo "Facebook post_log row is present for ${got_month}."
              break
            fi
            if [ "$code" -ne 2 ]; then
              echo "::error::Facebook post_log for ${got_month} is not exactly one posted row with an external id."
              fb_error=1
              break
            fi
            echo "Autoposter has not recorded ${got_month} yet (attempt $attempt)."
            if [ "$attempt" -lt 24 ]; then
              sleep 20
            fi
          done
          if [ "$fb_posted" != "1" ]; then
            if [ "$fb_error" != "1" ]; then
              echo "::error::Facebook monthly market update was not recorded for ${got_month}."
            fi
            failed=$((failed + 1))
          fi

          if [ "$failed" -gt 0 ]; then
            alert "${failed} market channel(s) did not post. See run ${{ github.run_id }}."
            exit 1
          fi
          echo "Done."
