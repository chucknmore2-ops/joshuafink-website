name: Listing events

# Same-day Just Listed, Coming Soon, Price Improved, Back on Market, and
# Open House posts to Instagram, Facebook (Buffer), and LinkedIn.
# Does not replace the weekly rotators in social-autopost.yml, and does not
# post Just Sold (that stays on the manual linkedin-post / gbp-post triggers).
#
# One event per HTTP call, at most 3 per run, 30 seconds apart. The route
# refuses to post when post_log cannot be read. The first run records the
# current listings and posts nothing.
#
# Facebook uses BUFFER_FB_CHANNEL_ID when it is set. When it is unset the
# route skips Facebook and still posts Instagram and LinkedIn.
#
# Triggers match GBP Just Listed:
#   - push to main that changes lib/listings.ts (a PAT merge)
#   - workflow_dispatch, including the dispatch from sync-listings.yml
#   - 14:20 and 20:20 UTC, in case the post-merge run was missed

on:
  schedule:
    - cron: '20 14 * * *'
    - cron: '20 20 * * *'
  push:
    branches: [main]
    paths:
      - 'lib/listings.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: listing-events
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post listing events once production is serving them
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_IG_CHANNEL_ID: ${{ secrets.BUFFER_IG_CHANNEL_ID }}
          BUFFER_FB_CHANNEL_ID: ${{ secrets.BUFFER_FB_CHANNEL_ID }}
        run: |
          alert() {
            echo "::error::$1"
            if [ -n "${PUSHOVER_TOKEN:-}" ] && [ -n "${PUSHOVER_USER:-}" ]; then
              curl -sS --fail -m 20 \
                --form-string "token=$PUSHOVER_TOKEN" \
                --form-string "user=$PUSHOVER_USER" \
                --form-string "title=Listing event post failed" \
                --form-string "message=$1" \
                --form-string "priority=1" \
                https://api.pushover.net/1/messages.json || echo "::warning::Pushover alert failed"
            fi
          }

          notice() {
            echo "$1"
            echo "::notice::$1"
          }

          if [ -z "$CRON_SECRET" ]; then
            alert "CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          if [ -z "$BUFFER_API_KEY" ] || [ -z "$BUFFER_IG_CHANNEL_ID" ]; then
            alert "BUFFER_API_KEY and BUFFER_IG_CHANNEL_ID are required for listing events."
            exit 1
          fi
          if [ -z "${BUFFER_FB_CHANNEL_ID:-}" ]; then
            echo "Facebook skipped: BUFFER_FB_CHANNEL_ID is not set"
          fi

          synced=$(sed -n 's/^export const listingsSyncedAt = "\([^"]*\)";/\1/p' lib/listings.ts)
          if [ -z "$synced" ]; then
            alert "Could not read listingsSyncedAt from lib/listings.ts."
            exit 1
          fi
          echo "Waiting until production listings are synced at $synced"

          ready=0
          last_preview_status="000"
          for attempt in $(seq 1 16); do
            html=$(curl -fsSL --max-time 25 "https://www.joshuafink.com/listings" || true)
            preview_file=$(mktemp)
            last_preview_status=$(curl -sS --max-time 25 -o "$preview_file" -w '%{http_code}' \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://www.joshuafink.com/api/cron/listing-events?preview=1" || true)
            if [ -z "$last_preview_status" ]; then
              last_preview_status=000
            fi
            preview=$(cat "$preview_file" || true)
            rm -f "$preview_file"

            page_ok=0
            mode_ok=0
            if printf '%s' "$html" | grep -F "$synced" >/dev/null; then
              page_ok=1
            fi
            if printf '%s' "$preview" | grep -F '"mode":"listing-events"' >/dev/null \
              || printf '%s' "$preview" | grep -F '"mode": "listing-events"' >/dev/null; then
              mode_ok=1
            fi
            echo "Attempt $attempt: page=$page_ok mode=$mode_ok preview_http=$last_preview_status"
            if [ "$page_ok" = "1" ] && [ "$mode_ok" = "1" ]; then
              ready=1
              echo "Production is serving this listing sync."
              break
            fi
            if [ "$attempt" -lt 16 ]; then
              sleep 30
            fi
          done

          if [ "$ready" != "1" ]; then
            if [ "$last_preview_status" = "401" ]; then
              alert "Listing events preview was unauthorized. Check that GitHub CRON_SECRET matches Vercel."
              exit 1
            fi
            notice "Production is not serving listingsSyncedAt ${synced} with the listing events route yet. Not posting."
            exit 0
          fi

          post_headers=(
            -H "Authorization: Bearer $CRON_SECRET"
            -H "X-Buffer-Api-Key: $BUFFER_API_KEY"
            -H "X-Buffer-Ig-Channel-Id: $BUFFER_IG_CHANNEL_ID"
          )
          if [ -n "${BUFFER_FB_CHANNEL_ID:-}" ]; then
            post_headers+=(-H "X-Buffer-Fb-Channel-Id: $BUFFER_FB_CHANNEL_ID")
          fi

          # Cap matches LISTING_EVENTS_PER_RUN / LISTING_EVENTS_GAP_MS.
          posted=0
          calls=0
          while [ "$posted" -lt 3 ] && [ "$calls" -lt 6 ]; do
            calls=$((calls + 1))
            echo "──────────────────────────────────────────────"
            echo "Posting one listing event (call $calls, posted $posted so far)."
            response=$(curl -sS --max-time 120 -w "\n%{http_code}" \
              "${post_headers[@]}" \
              "https://www.joshuafink.com/api/cron/listing-events" || true)
            status=$(printf '%s\n' "$response" | tail -n1)
            body=$(printf '%s\n' "$response" | sed '$d')
            echo "HTTP $status"
            echo "$body"

            if [ "$status" != "200" ]; then
              alert "Listing event call failed with HTTP ${status}. See run ${{ github.run_id }}."
              exit 1
            fi

            skipped=$(printf '%s' "$body" | jq -r '.skipped // empty' || true)
            did_post=$(printf '%s' "$body" | jq -r '.posted // false' || true)
            remaining=$(printf '%s' "$body" | jq -r '.remaining // 0' || true)

            if [ "$skipped" = "none_pending" ] || [ "$skipped" = "seeded" ]; then
              echo "No listing events to announce."
              exit 0
            fi
            if [ "$skipped" = "already_posted" ]; then
              echo "That event was already announced. Checking the next one."
              continue
            fi
            if [ "$did_post" = "true" ]; then
              posted=$((posted + 1))
              echo "Posted ($posted this run). Remaining after this post: $remaining"
              if [ "$remaining" = "0" ] || [ "$posted" -ge 3 ]; then
                echo "Done."
                exit 0
              fi
              echo "Waiting 30s before the next listing event."
              sleep 30
              continue
            fi

            alert "Listing events returned 200 but did not post. See run ${{ github.run_id }}."
            exit 1
          done
          echo "Done."
